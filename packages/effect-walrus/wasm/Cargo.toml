[package]
name = "walrus-wasm"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false
description = "Walrus RS2 erasure coding, sliver Merkle roots and BLS12-381 min-pk for @unconfirmed/effect-walrus"

[lib]
crate-type = ["cdylib"]
path = "src/lib.rs"

[dependencies]
bcs = "0.1.6"
# The exact version of the wasm-bindgen CLI the build script runs (it checks).
wasm-bindgen = "=0.2.127"
js-sys = "0.3"
# walrus-core at the commit docs/design/walrus.md cites (workspace version 1.62.0).
walrus-core = { git = "https://github.com/MystenLabs/walrus.git", rev = "2bd352b6a668bf6d73416536f9b2ed9beed61e84", package = "walrus-core" }
# The fastcrypto revision walrus-core 1.62.0 pins, with its `wasm` feature (getrandom for wasm32).
fastcrypto = { git = "https://github.com/MystenLabs/fastcrypto", rev = "4db0e90c732bbf7420ca20de808b698883148d9c", features = ["wasm"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
debug = false
strip = "debuginfo"

# reed-solomon-simd 3.1.0 (what walrus-core asks for) has no WebAssembly SIMD
# engine. The vendored copy is misofm/reed-solomon-simd at df19424 (branch
# wide-engine): a `wide` u8x16 engine that `DefaultEngine` selects at compile
# time when `simd128` is enabled, byte-identical to the scalar engine. See
# README.md.
[patch.crates-io]
reed-solomon-simd = { path = "vendor/reed-solomon-simd" }
